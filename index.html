<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Komar</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #111827, #1e3a8a);
    color: white;
    text-align: center;
}

h1 {
    margin-top: 25px;
}

#game {
    width: 90%;
    max-width: 400px;
    height: 500px;
    margin: 20px auto;
    background: #0f172a;
    border: 3px solid white;
    border-radius: 15px;
    position: relative;
    overflow: hidden;
}

#player {
    width: 50px;
    height: 50px;
    background: #22c55e;
    position: absolute;
    bottom: 15px;
    left: 175px;
    border-radius: 10px;
}

.enemy {
    width: 45px;
    height: 45px;
    background: #ef4444;
    position: absolute;
    top: -50px;
    border-radius: 50%;
}

#info {
    font-size: 20px;
    margin: 10px;
}

button {
    padding: 12px 25px;
    font-size: 18px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    background: #22c55e;
    color: white;
}

#gameOver {
    display: none;
    position: absolute;
    top: 180px;
    width: 100%;
    font-size: 25px;
}
</style>
</head>

<body>

<h1>🎮 GAME KOMAR</h1>

<div id="info">
    Skor: <span id="score">0</span>
    ❤️ Nyawa: <span id="lives">3</span>
</div>

<button onclick="startGame()">MULAI GAME</button>

<div id="game">

    <div id="player"></div>

    <div id="gameOver">
        💥 GAME OVER!<br><br>
        <button onclick="startGame()">MAIN LAGI</button>
    </div>

</div>

<script>

let player;
let score = 0;
let lives = 3;
let gameRunning = false;
let enemies = [];

function startGame() {

    score = 0;
    lives = 3;
    gameRunning = true;

    document.getElementById("score").textContent = score;
    document.getElementById("lives").textContent = lives;
    document.getElementById("gameOver").style.display = "none";

    enemies.forEach(e => e.remove());
    enemies = [];

    player = document.getElementById("player");
    player.style.left = "175px";

    createEnemy();

}

document.addEventListener("keydown", function(e) {

    if (!gameRunning) return;

    let left = parseInt(player.style.left);

    if (e.key === "ArrowLeft" && left > 0) {
        player.style.left = (left - 20) + "px";
    }

    if (e.key === "ArrowRight" && left < 350) {
        player.style.left = (left + 20) + "px";
    }

});

function createEnemy() {

    if (!gameRunning) return;

    let enemy = document.createElement("div");
    enemy.className = "enemy";

    enemy.style.left = Math.random() * 350 + "px";
    enemy.style.top = "-50px";

    document.getElementById("game").appendChild(enemy);
    enemies.push(enemy);

    let position = -50;

    let fall = setInterval(function() {

        if (!gameRunning) {
            clearInterval(fall);
            return;
        }

        position += 5;
        enemy.style.top = position + "px";

        let playerLeft = parseInt(player.style.left);
        let enemyLeft = parseInt(enemy.style.left);

        if (
            position > 430 &&
            enemyLeft < playerLeft + 50 &&
            enemyLeft + 45 > playerLeft
        ) {

            enemy.remove();
            clearInterval(fall);

            lives--;
            document.getElementById("lives").textContent = lives;

            if (lives <= 0) {
                gameOver();
            }

            return;
        }

        if (position > 500) {

            enemy.remove();
            clearInterval(fall);

            score++;
            document.getElementById("score").textContent = score;

            createEnemy();
        }

    }, 30);
}

function gameOver() {

    gameRunning = false;

    document.getElementById("gameOver").style.display = "block";

}

</script>

</body>
</html>
