```html
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Tangkap Kotak</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            text-align: center;
        }

        h1 {
            margin-top: 25px;
        }

        #info {
            font-size: 20px;
            margin: 15px;
        }

        #gameArea {
            width: 90%;
            max-width: 600px;
            height: 400px;
            margin: auto;
            background: #f3f4f6;
            border: 4px solid white;
            border-radius: 15px;
            position: relative;
            overflow: hidden;
        }

        #box {
            width: 50px;
            height: 50px;
            background: red;
            position: absolute;
            border-radius: 10px;
            cursor: pointer;
        }

        button {
            margin: 20px;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #22c55e;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #16a34a;
        }
    </style>
</head>

<body>

    <h1>🎮 Tangkap Kotak</h1>

    <div id="info">
        Skor: <span id="score">0</span>
        &nbsp; | &nbsp;
        Waktu: <span id="time">30</span>
    </div>

    <div id="gameArea">
        <div id="box"></div>
    </div>

    <button onclick="startGame()">Mulai Game</button>

    <script>
        let score = 0;
        let time = 30;
        let gameStarted = false;
        let timer;

        const box = document.getElementById("box");
        const gameArea = document.getElementById("gameArea");
        const scoreText = document.getElementById("score");
        const timeText = document.getElementById("time");

        function moveBox() {
            const maxX = gameArea.clientWidth - box.offsetWidth;
            const maxY = gameArea.clientHeight - box.offsetHeight;

            const x = Math.floor(Math.random() * maxX);
            const y = Math.floor(Math.random() * maxY);

            box.style.left = x + "px";
            box.style.top = y + "px";
        }

        box.addEventListener("click", function() {

            if (!gameStarted) return;

            score++;
            scoreText.textContent = score;

            moveBox();
        });

        function startGame() {

            score = 0;
            time = 30;
            gameStarted = true;

            scoreText.textContent = score;
            timeText.textContent = time;

            moveBox();

            clearInterval(timer);

            timer = setInterval(function() {

                time--;
                timeText.textContent = time;

                if (time <= 0) {

                    clearInterval(timer);
                    gameStarted = false;

                    alert("Game selesai! Skor kamu: " + score);
                }

            }, 1000);
        }

        moveBox();
    </script>

</body>
</html>
