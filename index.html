<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Komar Archer 3D</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #07111f, #162b3f);
    color: white;
    text-align: center;
}

h1 {
    margin: 18px 0 8px;
    font-size: 28px;
}

#info {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
    margin: 10px;
}

.stat {
    background: rgba(255,255,255,0.12);
    padding: 9px 13px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.2);
}

button {
    border: none;
    border-radius: 12px;
    padding: 13px 25px;
    margin: 8px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    color: white;
    background: #16803c;
}

button:hover {
    background: #1da34d;
}

#restart {
    display: none;
}

#message {
    min-height: 30px;
    font-size: 20px;
    font-weight: bold;
}

#game {
    position: relative;
    width: 94%;
    max-width: 750px;
    height: 470px;
    margin: 15px auto;
    overflow: hidden;

    border: 3px solid #8193a5;
    border-radius: 18px;

    background:
        linear-gradient(
            rgba(0,0,0,0.15),
            rgba(0,0,0,0.15)
        ),
        linear-gradient(
            #6ca6c1 0%,
            #356f87 50%,
            #234d32 50%,
            #173c24 100%
        );

    box-shadow:
        0 0 30px rgba(0,0,0,0.5);

    cursor: crosshair;
}

/* Bulan */

#moon {
    position: absolute;
    width: 75px;
    height: 75px;
    border-radius: 50%;
    background: #fff4c2;
    right: 35px;
    top: 30px;
    box-shadow: 0 0 25px rgba(255,244,194,0.6);
}

/* Bintang */

.star {
    position: absolute;
    width: 4px;
    height: 4px;
    background: white;
    border-radius: 50%;
}

/* Target */

#target {
    position: absolute;

    width: 75px;
    height: 75px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle,
            #111 0 12%,
            #f5f5f5 12% 28%,
            #d62828 28% 48%,
            #f5f5f5 48% 68%,
            #d62828 68% 82%,
            #f5f5f5 82% 100%
        );

    border: 4px solid #111;

    box-shadow:
        0 5px 15px rgba(0,0,0,0.5);

    display: none;

    cursor: crosshair;

    touch-action: manipulation;
}

/* Busur 3D */

#archer {
    position: absolute;
    left: 50%;
    bottom: 0;

    width: 180px;
    height: 150px;

    transform:
        translateX(-50%)
        perspective(500px)
        rotateX(8deg);

    pointer-events: none;
}

/* tangan */

.hand {
    position: absolute;
    width: 55px;
    height: 45px;

    background: linear-gradient(
        145deg,
        #d99a6c,
        #9d5f3b
    );

    border-radius: 45% 45% 35% 35%;

    bottom: 15px;
}

.hand.left {
    left: 15px;
    transform: rotate(-25deg);
}

.hand.right {
    right: 15px;
    transform: rotate(25deg);
}

/* lengan */

.arm {
    position: absolute;
    width: 85px;
    height: 28px;

    background: linear-gradient(
        90deg,
        #24364a,
        #111b29
    );

    border-radius: 20px;

    bottom: 38px;
}

.arm.left {
    left: 25px;
    transform: rotate(-25deg);
}

.arm.right {
    right: 25px;
    transform: rotate(25deg);
}

/* busur */

.bow {
    position: absolute;

    left: 50%;
    bottom: 28px;

    width: 105px;
    height: 125px;

    transform: translateX(-50%);

    border: 9px solid #8b5a2b;

    border-left-color: transparent;
    border-radius: 50%;

    filter: drop-shadow(4px 5px 4px rgba(0,0,0,0.5));
}

/* tali busur */

.string {
    position: absolute;

    left: 50%;
    bottom: 28px;

    width: 3px;
    height: 125px;

    background: #eee;

    transform: translateX(-50%);
}

/* anak panah */

.arrow {
    position: absolute;

    left: 50%;
    bottom: 88px;

    width: 115px;
    height: 5px;

    background: #d8b56b;

    transform:
        translateX(-50%)
        rotate(-8deg);

    border-radius: 5px;

    box-shadow: 0 2px 3px rgba(0,0,0,0.5);
}

.arrow::after {
    content: "";

    position: absolute;

    right: -10px;
    top: -5px;

    width: 0;
    height: 0;

    border-top: 8px solid transparent;
    border-bottom: 8px solid transparent;
    border-left: 16px solid #aaa;
}

.arrow::before {
    content: "";

    position: absolute;

    left: -3px;
    top: -7px;

    width: 12px;
    height: 16px;

    background: #c0392b;

    clip-path: polygon(
        0 50%,
        100% 0,
        75% 50%,
        100% 100%
    );
}

/* crosshair */

#crosshair {
    position: fixed;

    width: 38px;
    height: 38px;

    border: 2px solid white;

    border-radius: 50%;

    transform: translate(-50%, -50%);

    pointer-events: none;

    display: none;

    z-index: 20;
}

#crosshair::before {
    content: "";

    position: absolute;

    width: 2px;
    height: 52px;

    background: white;

    left: 16px;
    top: -9px;
}

#crosshair::after {
    content: "";

    position: absolute;

    width: 52px;
    height: 2px;

    background: white;

    left: -9px;
    top: 16px;
}

/* efek hit */

.hit {
    animation: hit 0.2s;
}

@keyframes hit {

    0% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.3);
    }

    100% {
        transform: scale(1);
    }

}

/* HP */

#level {
    color: #ffd166;
}

</style>
</head>

<body>

<h1>🏹 KOMAR ARCHER 3D</h1>

<div id="info">

    <div class="stat">
        🏆 Skor:
        <span id="score">0</span>
    </div>

    <div class="stat">
        ⭐ Level:
        <span id="level">1</span>
    </div>

    <div class="stat">
        ❤️ Nyawa:
        <span id="lives">3</span>
    </div>

    <div class="stat">
        🎯 Target:
        <span id="targetCount">0</span>
    </div>

</div>

<button id="start">
    ▶ MULAI GAME
</button>

<button id="restart">
    🔄 MAIN LAGI
</button>

<div id="message">
    Tekan MULAI GAME untuk bermain!
</div>

<div id="game">

    <div id="moon"></div>

    <div class="star" style="left:15%;top:12%;"></div>
    <div class="star" style="left:30%;top:22%;"></div>
    <div class="star" style="left:48%;top:10%;"></div>
    <div class="star" style="left:70%;top:18%;"></div>
    <div class="star" style="left:82%;top:35%;"></div>

    <div id="target"></div>

    <div id="archer">

        <div class="arm left"></div>
        <div class="arm right"></div>

        <div class="hand left"></div>
        <div class="hand right"></div>

        <div class="bow"></div>

        <div class="string"></div>

        <div class="arrow"></div>

    </div>

</div>

<div id="crosshair"></div>

<script>

/* =========================
   DATA GAME
========================= */

const game = document.getElementById("game");
const target = document.getElementById("target");

const scoreText = document.getElementById("score");
const levelText = document.getElementById("level");
const livesText = document.getElementById("lives");
const targetCountText =
    document.getElementById("targetCount");

const message =
    document.getElementById("message");

const startButton =
    document.getElementById("start");

const restartButton =
    document.getElementById("restart");

const crosshair =
    document.getElementById("crosshair");

let score = 0;
let level = 1;
let lives = 3;
let targetCount = 0;

let gameRunning = false;

let moveTimer;
let levelTimer;


/* =========================
   SUARA
========================= */

let audioContext;

function initAudio() {

    if (!audioContext) {

        const AudioCtx =
            window.AudioContext ||
            window.webkitAudioContext;

        if (!AudioCtx) return;

        audioContext = new AudioCtx();
    }

    if (audioContext.state === "suspended") {

        audioContext.resume();

    }

}


/* suara panah */

function shootSound() {

    initAudio();

    if (!audioContext) return;

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.type = "triangle";

    oscillator.frequency.setValueAtTime(
        500,
        audioContext.currentTime
    );

    oscillator.frequency.exponentialRampToValueAtTime(
        130,
        audioContext.currentTime + 0.18
    );

    gain.gain.setValueAtTime(
        0.25,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.01,
        audioContext.currentTime + 0.18
    );

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start();

    oscillator.stop(
        audioContext.currentTime + 0.18
    );

}


/* suara kena target */

function hitSound() {

    initAudio();

    if (!audioContext) return;

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.type = "square";

    oscillator.frequency.setValueAtTime(
        500,
        audioContext.currentTime
    );

    oscillator.frequency.exponentialRampToValueAtTime(
        1000,
        audioContext.currentTime + 0.1
    );

    gain.gain.setValueAtTime(
        0.18,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.01,
        audioContext.currentTime + 0.15
    );

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start();

    oscillator.stop(
        audioContext.currentTime + 0.15
    );

}


/* suara level naik */

function levelSound() {

    initAudio();

    if (!audioContext) return;

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.type = "sine";

    oscillator.frequency.setValueAtTime(
        400,
        audioContext.currentTime
    );

    oscillator.frequency.exponentialRampToValueAtTime(
        900,
        audioContext.currentTime + 0.4
    );

    gain.gain.setValueAtTime(
        0.2,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        0.01,
        audioContext.currentTime + 0.4
    );

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start();

    oscillator.stop(
        audioContext.currentTime + 0.4
    );

}


/* =========================
   MULAI GAME
========================= */

function startGame() {

    initAudio();

    score = 0;
    level = 1;
    lives = 3;
    targetCount = 0;

    gameRunning = true;

    scoreText.textContent = score;
    levelText.textContent = level;
    livesText.textContent = lives;
    targetCountText.textContent = targetCount;

    message.textContent =
        "🎯 Bidik target!";

    startButton.style.display = "none";
    restartButton.style.display = "none";

    target.style.display = "block";

    target.classList.remove("hit");

    startLevel();

}


/* =========================
   LEVEL
========================= */

function startLevel() {

    if (!gameRunning) return;

    clearInterval(moveTimer);

    /*
       Level 1 = lambat
       Level semakin tinggi
       = semakin cepat
    */

    const speed =
        Math.max(
            250,
            950 - ((level - 1) * 75)
        );

    /*
       Target semakin kecil
    */

    const size =
        Math.max(
            38,
            75 - ((level - 1) * 4)
        );

    target.style.width =
        size + "px";

    target.style.height =
        size + "px";

    message.textContent =
        "⭐ LEVEL " +
        level +
        " — Target makin cepat!";

    moveTarget();

    moveTimer = setInterval(
        moveTarget,
        speed
    );

}


/* =========================
   GERAK TARGET
========================= */

function moveTarget() {

    if (!gameRunning) return;

    const maxX =
        game.clientWidth -
        target.offsetWidth;

    const maxY =
        game.clientHeight -
        target.offsetHeight -
        120;

    const x =
        Math.random() * Math.max(1, maxX);

    const y =
        Math.random() * Math.max(1, maxY);

    target.style.left =
        x + "px";

    target.style.top =
        y + "px";

}


/* =========================
   TARGET KENA
========================= */

target.addEventListener(
    "click",
    function(event) {

        event.stopPropagation();

        if (!gameRunning) return;

        score += 10;

        targetCount++;

        scoreText.textContent =
            score;

        targetCountText.textContent =
            targetCount;

        hitSound();

        target.classList.remove("hit");

        void target.offsetWidth;

        target.classList.add("hit");

        message.textContent =
            "🎯 KENA! +10";

        /*
           Setiap 5 target
           naik level
        */

        if (targetCount % 5 === 0) {

            level++;

            levelText.textContent =
                level;

            levelSound();

            message.textContent =
                "⭐ LEVEL " +
                level +
                " TERBUKA!";

            startLevel();

        } else {

            moveTarget();

        }

    }
);


/* =========================
   TEMBAK / MELESET
========================= */

game.addEventListener(
    "click",
    function(event) {

        if (!gameRunning) return;

        shootSound();

        lives--;

        livesText.textContent =
            lives;

        message.textContent =
            "💨 Meleset!";

        moveTarget();

        if (lives <= 0) {

            endGame(
                "💥 GAME OVER!"
            );

        }

    }
);


/* =========================
   GAME OVER
========================= */

function endGame(text) {

    gameRunning = false;

    clearInterval(moveTimer);

    clearInterval(levelTimer);

    target.style.display = "none";

    crosshair.style.display = "none";

    message.innerHTML =
        text +
        "<br>🏆 Skor akhir: " +
        score +
        "<br>⭐ Level terakhir: " +
        level;

    restartButton.style.display =
        "inline-block";

}


/* =========================
   TOMBOL
========================= */

startButton.addEventListener(
    "click",
    startGame
);

restartButton.addEventListener(
    "click",
    startGame
);


/* =========================
   CROSSHAIR
========================= */

document.addEventListener(
    "mousemove",
    function(event) {

        if (!gameRunning) return;

        crosshair.style.display =
            "block";

        crosshair.style.left =
            event.clientX + "px";

        crosshair.style.top =
            event.clientY + "px";

    }
);

</script>

</body>
</html>
